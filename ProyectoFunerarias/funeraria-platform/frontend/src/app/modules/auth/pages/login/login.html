<div class="login-wrapper">
  <div class="login-card">
    <div class="logo-area">
      <span class="logo-icon">🕊️</span>
      <h1>Plataforma Funeraria</h1>
      <p class="subtitle">Acceso al panel de administración</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="login-form" novalidate>

      <div class="form-group">
        <label for="tenant_slug">Identificador de Funeraria</label>
        <input
          id="tenant_slug"
          type="text"
          formControlName="tenant_slug"
          placeholder="ej: eternidad"
          autocomplete="organization"
        />
        <span class="field-error" *ngIf="loginForm.get('tenant_slug')?.invalid && loginForm.get('tenant_slug')?.touched">
          Campo obligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@funeraria.com"
          autocomplete="email"
        />
        <span class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Correo inválido
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <span class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMsg" role="alert">
        ⚠️ {{ errorMsg }}
      </div>

      <button
        id="login-submit-btn"
        type="submit"
        class="btn-primary"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="spinner">⟳ Verificando...</span>
      </button>
    </form>

    <div class="card-footer">
      <a routerLink="/home">← Volver al sitio público</a>
    </div>
  </div>
</div>
