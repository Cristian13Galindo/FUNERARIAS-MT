services:
  mongodb:
    image: mongo:7
    container_name: funeraria_mongo
    environment:
      MONGO_INITDB_DATABASE: funeraria_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - funeraria_net

  backend:
    build: ./backend
    container_name: funeraria_backend
    environment:
      MONGO_URI: "mongodb://mongodb:27017/funeraria_db"
      JWT_SECRET_KEY: "supersecretkey_cambiar_en_produccion"
      UPLOAD_FOLDER: "/app/uploads"
      FLASK_ENV: "development"
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "funeraria-realm"
      KEYCLOAK_CLIENT_ID: "funeraria-client"
      KEYCLOAK_CLIENT_SECRET: "funeraria-client-secret"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - funeraria_net

  # ── Frontend: La Eternidad ──────────────────────────────────────────────────
  frontend-eternidad:
    build:
      context: ./frontend
      dockerfile: Dockerfile.eternidad
    container_name: funeraria_frontend_eternidad
    ports:
      - "4201:80"
    depends_on:
      - backend
    networks:
      - funeraria_net

  # ── Frontend: Los Olivos ────────────────────────────────────────────────────
  frontend-losolivos:
    build:
      context: ./frontend
      dockerfile: Dockerfile.losolivos
    container_name: funeraria_frontend_losolivos
    ports:
      - "4202:80"
    depends_on:
      - backend
    networks:
      - funeraria_net

  # ── Frontend: Funeraria Central ─────────────────────────────────────────────
  frontend-central:
    build:
      context: ./frontend
      dockerfile: Dockerfile.central
    container_name: funeraria_frontend_central
    ports:
      - "4203:80"
    depends_on:
      - backend
    networks:
      - funeraria_net

  kafka:
    image: apache/kafka:latest
    container_name: funeraria_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    networks:
      - funeraria_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: funeraria_kafka_ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - funeraria_net

  postgres:
    image: postgres:16
    container_name: funeraria_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funeraria_net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: funeraria_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/seedKey.json:/opt/keycloak/data/import/seedKey.json:ro
    command: start-dev --import-realm
    depends_on:
      - postgres
    networks:
      - funeraria_net

volumes:
  mongo_data:
  uploads_data:
  postgres_data:

networks:
  funeraria_net: