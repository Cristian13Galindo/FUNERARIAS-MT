version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: funeraria_mongo
    environment:
      MONGO_INITDB_DATABASE: funeraria_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - funeraria_net

  backend:
    build: ./backend
    container_name: funeraria_backend
    environment:
      MONGO_URI: "mongodb://mongodb:27017/funeraria_db"
      JWT_SECRET_KEY: "supersecretkey_cambiar_en_produccion"
      UPLOAD_FOLDER: "/app/uploads"
      FLASK_ENV: "development"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - funeraria_net

  frontend:
    build: ./frontend
    container_name: funeraria_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - funeraria_net

  kafka:
    image: bitnami/kafka:3.6
    container_name: funeraria_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    networks:
      - funeraria_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: funeraria_kafka_ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - funeraria_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: funeraria_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - funeraria_net

volumes:
  mongo_data:
  uploads_data:
networks:
  funeraria_net:
